# Pizza 42 — Auth0 Machine-to-Machine credentials
#
# This is an EXAMPLE. Copy to k8s/secret.yaml, fill real values, and apply with:
#   kubectl apply -f k8s/secret.yaml
#
# Or create it imperatively (recommended) so secrets never sit in YAML files:
#   kubectl create secret generic auth0-m2m \
#     --from-literal=client_id='YOUR_M2M_CLIENT_ID' \
#     --from-literal=client_secret='YOUR_M2M_CLIENT_SECRET'

apiVersion: v1
kind: Secret
metadata:
  name: auth0-m2m
type: Opaque
stringData:
  client_id: "REPLACE_WITH_M2M_CLIENT_ID"
  client_secret: "REPLACE_WITH_M2M_CLIENT_SECRET"
