apiVersion: v1
kind: Service
metadata:
  name: react-app
  annotations:
    # Use the AWS Network Load Balancer (cheaper, faster) instead of Classic ELB
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: react-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      name: http
